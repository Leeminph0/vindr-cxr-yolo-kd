# Cau hinh chung cho MOI mo hinh (review, muc "Cac bo phat hien moi can them"):
# cung co (ban s), cung kich thuoc anh, cung so epoch, cung cach tang cuong du lieu.
# Truyen vao ultralytics: model.train(**cfg['train'], seed=s) voi s trong seeds.
# Muc nao ghi CAN XAC NHAN: lay dung gia tri trong bai SP-Det khi tai lap (buoc 1.1).

ultralytics_version: "8.4.171"
seeds: [0, 1, 2, 3, 4]            # 5 seed (Bang 3, muc 7)

models:                           # Bang 4
  prompt_backbones: [yolov8s.pt, yolo11s.pt, yolo12s.pt, yolo26s.pt]   # gan khoi goi y SP-Det
  independent: [yolov8s-worldv2.pt, yoloe-26s, d-fine-s, rf-detr-small]  # doi thu doc lap; CAN XAC NHAN ten trong so (D-FINE, RF-DETR chay bang repo rieng)

train:
  # Theo muc 4.3 bai SP-Det (Li, Zou et al., Knowledge-Based Systems 2025). Review yeu cau
  # moi mo hinh dung cung cau hinh, nen ap cac gia tri nay cho CA cac nen YOLO va doi thu.
  optimizer: AdamW
  lr0: 0.00015                    # 1.5e-4
  batch: 32                       # bai dung 2 x NVIDIA A5000; neu it GPU hon, giu batch 32 bang tich luy
  epochs: 100                     # toi da 100 epoch
  patience: 20                    # bai dung early stopping 20 epoch theo val loss; ultralytics dung fitness (mAP), ghi ro trong bai
  imgsz: 640                      # BAI KHONG NEU; 640 la mac dinh cua ultralytics va YOLO-World. Buoc 3.5 so them 1024
  mosaic: 1.0                     # bai khong neu tang cuong du lieu -> mac dinh ultralytics; buoc 3.5 so bat va tat
  close_mosaic: 10
  fliplr: 0.0                     # khong lat trai phai: tim, quai dong mach co vi tri giai phau co dinh (lech mac dinh 0.5, ghi ro)
  degrees: 0.0
  deterministic: true
  workers: 8

spdet:                            # thanh phan rieng cua SP-Det (muc 3 va 4.3 cua bai), khong truyen vao model.train
  init_weights: yolov8s-worldv2.pt   # SP-Det khoi tao tu YOLO-World; baseline tinh chinh tu trong so goc cua tung mo hinh
  report_generator: CheXagent (SigLIP-Large + Phi-2), prompt "Describe the chest X-ray image", 1 luot
  semantic_context_encoder: bert-base-uncased     # Bang 5: tot nhat
  disease_beacon_encoder: CLIP ViT-B/32
  enhancer_depth: 2                               # Bang 6: tot nhat
  enhancer_level: chi feature map cap cao nhat

data:
  dataset: VinDr-CXR v1.0.0
  n_classes: 14                   # bo lop 14 "No finding"
  label_fusion: wbf               # gop hop 3 bac si o tap train bang WBF (review, co loi so 3)
  wbf_iou_thr: 0.4
  split_original: "8:1:1 tren 4,394 anh co ton thuong (tai lap SP-Det, buoc 1)"
  split_official: "15,000 train / 3,000 test chinh thuc, giu anh binh thuong (buoc 2)"

eval:                             # eval/cxr_eval.py
  main_metric: mAP40
  iou_thrs_reported: [0.4, "0.4:0.95", 0.5, "0.5:0.95"]
  froc_fps: [0.5, 1, 2, 4]
  n_bootstrap: 1000
  max_det: 100
